services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: comments-app:local
    working_dir: /var/www/html
    command: sh -c "composer install --no-interaction --prefer-dist && exec php-fpm"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_URL: http://localhost:${APP_HTTP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-comments}
      DB_USERNAME: ${DB_USERNAME:-comments}
      DB_PASSWORD: ${DB_PASSWORD:-comments}
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-comments}
      REVERB_APP_ID: ${REVERB_APP_ID:-comments}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-comments-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-comments-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: rabbitmq
      BROADCAST_CONNECTION: reverb
      CACHE_STORE: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  vite:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    environment:
      APP_HTTP_PORT: ${APP_HTTP_PORT:-8080}
      VITE_PORT: ${VITE_PORT:-5173}
      VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-comments-local-key}
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: ${REVERB_HOST_PORT:-8081}
      VITE_REVERB_SCHEME: http
      VITE_NOCAPTCHA_SITEKEY: ${NOCAPTCHA_SITEKEY:-}
      VITE_MEDIA_IMAGE_MAX_MB: ${MEDIA_IMAGE_MAX_MB:-10}
    depends_on:
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-comments}
      MYSQL_USER: ${DB_USERNAME:-comments}
      MYSQL_PASSWORD: ${DB_PASSWORD:-comments}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-comments-root}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-comments}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  queue-worker:
    image: comments-app:local
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "rabbitmq", "--queue=broadcasts,mail", "--sleep=1", "--tries=3", "--backoff=10"]
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_URL: http://localhost:${APP_HTTP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-comments}
      DB_USERNAME: ${DB_USERNAME:-comments}
      DB_PASSWORD: ${DB_PASSWORD:-comments}
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-comments}
      REVERB_APP_ID: ${REVERB_APP_ID:-comments}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-comments-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-comments-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: rabbitmq
      BROADCAST_CONNECTION: reverb
      CACHE_STORE: redis
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started

  reverb:
    image: comments-app:local
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_HOST_PORT:-8081}:8080"
    volumes:
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    environment:
      APP_URL: http://localhost:${APP_HTTP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-comments}
      DB_USERNAME: ${DB_USERNAME:-comments}
      DB_PASSWORD: ${DB_PASSWORD:-comments}
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-comments}
      REVERB_APP_ID: ${REVERB_APP_ID:-comments}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-comments-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-comments-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      QUEUE_CONNECTION: rabbitmq
      BROADCAST_CONNECTION: reverb
      CACHE_STORE: redis
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

volumes:
  app_vendor:
  app_storage:
  app_bootstrap_cache:
  vite_node_modules:
  mysql_data:
  redis_data:
  rabbitmq_data:
  mailpit_data:
